name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgequeue
          POSTGRES_PASSWORD: forgequeue
          POSTGRES_DB: forgequeue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgequeue -d forgequeue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://forgequeue:forgequeue@localhost:5432/forgequeue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go mod tidy
      - run: go test ./...
