name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forgequeue
          POSTGRES_PASSWORD: forgequeue
          POSTGRES_DB: forgequeue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgequeue -d forgequeue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://forgequeue:forgequeue@localhost:5432/forgequeue
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go mod tidy
      - run: go test ./...
      - name: Benchmark PostgreSQL claim throughput
        shell: bash
        run: |
          set -o pipefail
          go test ./internal/queue -run '^$' -bench '^BenchmarkPostgresQueueClaimNext$' -benchmem -benchtime=1s -cpu=1,4,16 | tee /tmp/forgequeue-benchmark.txt
          {
            echo '### PostgreSQL job-claim benchmark'
            echo
            echo 'CI-host measurements; these are a comparative baseline, not a production capacity guarantee.'
            echo
            echo '| GOMAXPROCS | Jobs/sec | ns/op |'
            echo '|---:|---:|---:|'
            awk '$1 ~ /^BenchmarkPostgresQueueClaimNext-/ && $4 == "ns/op" { split($1, parts, "-"); rate = 1000000000 / $3; printf "| %s | %.1f | %.0f |\n", parts[2], rate, $3 }' /tmp/forgequeue-benchmark.txt
          } >> "$GITHUB_STEP_SUMMARY"
